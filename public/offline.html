<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#146C43" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <title>Offline — SayAgain</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f7faf8;
        color: #132019;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #dce7e0;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #eaf5ee;
        color: #146c43;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.3;
      }
      p {
        margin: 0 0 20px;
        color: #52635a;
        font-size: 15px;
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: #146c43;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 20px;
        min-height: 44px;
        cursor: pointer;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">Offline Mode</span>
      <h1>You’re currently offline</h1>
      <p>
        SayAgain connects to your account to keep flashcard reviews and spaced-repetition schedules safely synced across devices. Reconnect and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
